name: Feature request
description: Suggest a demonstrable improvement to prompt-me.
title: "feat: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need, not just a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired observable behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Agent/compatibility considerations
      description: Include supporting vendor documentation if relevant.
  - type: textarea
    id: acceptance
    attributes:
      label: Example acceptance criteria
