name: Validate prompt-me
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Bash syntax
        run: bash -n scripts/install.sh tests/test_install.sh
      - name: Validate skill and Markdown links
        run: python scripts/validate.py
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test installer
        run: bash tests/test_install.sh
